name: OCR genuine English 1765 printed column separately from machine translation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ocr-english1765.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install English print OCR and imaging libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python3 -m pip install Pillow
      - name: Recognize original 1765 English right-hand columns from all scans
        run: python3 scripts/ocr_english_1765.py
      - name: Archive all original-English OCR drafts without verified-text claim
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add public/english-1765-ocr public/data/english-1765-ocr-provenance.json
          git commit -m "Archive draft OCR of original 1765 English printed columns [skip ci]"
          git push origin HEAD:main
