name: Evaluate high-fidelity Fraktur recognition against archival scans
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fraktur-ocr-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent historical print recognizer
        run: |
          python -m pip install -q kraken==7.2.0
          curl -fLsS --retry 3 --max-time 120 'https://zenodo.org/records/10519596/files/german_print.mlmodel?download=1' -o /tmp/german_print.mlmodel
          test $(stat -c%s /tmp/german_print.mlmodel) -gt 1000000
          echo 'Model installed'
      - name: Check authentic 1768 page recognition on Old and New Testament
        run: |
          for leaf in 001-01 071-01; do
            echo "=== TRANSCRIPTION $leaf ==="
            kraken -i public/folios/$leaf.webp /tmp/$leaf.txt segment -bl ocr -m /tmp/german_print.mlmodel
            wc -cm /tmp/$leaf.txt
            sed -n '1,70p' /tmp/$leaf.txt | head -c 8000
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-image-kraken-sample
          path: /tmp/*-01.txt
          if-no-files-found: ignore
