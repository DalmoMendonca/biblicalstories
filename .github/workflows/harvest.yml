name: Import 104 historical engravings
on:
  push:
    branches: [main]
    paths:
      - 'scripts/harvest.py'
      - '.github/workflows/harvest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Import and verify original scans
        run: python scripts/harvest.py
      - name: Confirm complete and distinct illustration collection
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('public')
          a=json.loads((p/'data/archive.json').read_text())
          assert len(a['images'])==104
          assert [x['number'] for x in a['images'][:52]]==list(range(1,53))
          assert [x['number'] for x in a['images'][52:]]==list(range(1,53))
          assert len(list((p/'art').glob('*.webp')))==104
          assert len(list((p/'art/thumb').glob('*.webp')))==104
          assert len(set(x['original_image'] for x in a['images']))==104
          print('PASS: 104 distinct historical plates, numbered 1–52 × 2, all saved locally')
          PY
      - name: Publish images and archival metadata to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art public/data
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Archive 104 original 1768 engravings and German OCR [skip ci]"
            git push origin HEAD:main
          fi
