name: Verify live rebuilt Netlify preview
on:
  push:
    paths: [.github/workflows/smoke-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify live publication and archive
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          root="https://majestic-babka-915bca.netlify.app"
          endpoints=["/","/src/app.js","/styles.css","/data/archive.json","/engravings/001.webp","/engravings/104.webp","/folios/001-01.webp"]
          for path in endpoints:
            try:
              req=urllib.request.Request(root+path,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read(2000)
                print(path,"HTTP",r.status,"TYPE",r.headers.get("Content-Type"),"FIRST_BYTES",repr(body[:60]))
            except Exception as ex: print(path,"FAILED",type(ex).__name__,str(ex))
          PY
