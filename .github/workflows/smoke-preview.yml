name: Verify live rebuilt Netlify preview
on:
  push:
    paths: [.github/workflows/smoke-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify protected preview and original images
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,base64
          root="https://majestic-babka-915bca.netlify.app"
          combos=["",":My-Drop-Site","Netlify:My-Drop-Site","preview:My-Drop-Site","My-Drop-Site:My-Drop-Site","user:My-Drop-Site","admin:My-Drop-Site","My-Drop-Site:"]
          for auth in combos:
            h={"User-Agent":"Mozilla/5.0"}
            if auth:h["Authorization"]="Basic "+base64.b64encode(auth.encode()).decode()
            req=urllib.request.Request(root+"/",headers=h)
            try:
              with urllib.request.urlopen(req,timeout=12) as r:
                print("TEST",repr(auth),"STATUS",r.status,"CTYPE",r.headers.get("Content-Type"),"SAMPLE",repr(r.read(130)))
            except urllib.error.HTTPError as e:
              print("TEST",repr(auth),"STATUS",e.code,"WWW",e.headers.get("WWW-Authenticate"),"CTYPE",e.headers.get("Content-Type"),"HTML",repr(e.read(2300)) if not auth else "")
            except Exception as e: print("TEST",repr(auth),"ERROR",repr(e))
          PY
