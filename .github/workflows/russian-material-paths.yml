name: Resolve public Russian edition attachment paths
on:
  push:
    branches: [main]
    paths: ['.github/workflows/russian-material-paths.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Identify legal public access to original 1825 scans
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,concurrent.futures,json,urllib.parse
          domain='https://kp.rusneb.ru/'
          id='5fcf8bb3991f3b91423439b5'
          slug='sto-chetyre-svyashchennyya-istorii-pyatdesyat-dve-svyashchennyya-istorii-iz-vethago-zaveta--ch1'
          routes=['materials/'+id,'documents/'+id,'document/'+id,'material/'+id,
            'items/'+id,'book/'+id,'books/'+id,'reader/'+id,
            'reader/materials/'+id,'reader/documents/'+id,'reader/books/'+id,
            'search-v2/documents/'+id,'search-v2/materials/'+id,
            'materials/'+slug,'documents/'+slug,'reader/material/'+slug,
            'materials/'+id+'/pages','documents/'+id+'/pages',
            'reader/'+id+'/pages','materials/'+id+'/attachments',
            'attachments/'+id,'attachment/'+id]
          urls=[domain+'api/v1/'+r for r in routes]
          urls += [domain+'attachments_new/attachment/original/5fd/11b/e77/5fd11be77b7a2287681300eb.pdf',
                   domain+'attachments_new/attachment/download/5fd/11b/e77/5fd11be77b7a2287681300eb',
                   domain+'attachments_new/attachment/preview/5fd/11b/e77/5fd11be77b7a2287681300eb-preview.jpg']
          def get(url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,image/*,*/*'})
              with urllib.request.urlopen(req,timeout=10) as response:
                dat=response.read(3000)
                return url.replace(domain,''),response.status,response.headers.get('Content-Type',''),response.headers.get('Content-Length',''),dat[:350].decode('utf8','replace').replace('\n',' ')
            except urllib.error.HTTPError as e:return url.replace(domain,''),e.code,'HTTP',None,str(e)[:90]
            except Exception as e:return url.replace(domain,''),'FAILED','',None,str(e)[:120]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
            for x in pool.map(get,urls):print('PROBE',*x,flush=True)
          PY