name: Validate original Russian 1825 page scan manifests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/russian-1825-pages-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,json,urllib.error
          root='https://kp.rusneb.ru/'
          volumes=[('old','5fcf8bb3991f3b91423439b5'),('new','5fcf8bb3991f3b91423439ad')]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=35) as r:
              return r.status,r.headers.get('Content-Type',''),r.headers.get('Content-Length',''),r.read(200000)
          for book,id in volumes:
            print('VOLUME',book,id,flush=True)
            try:
              code,typ,n,b=get(root+'api/v1/materials/'+id+'/pages')
              pages=json.loads(b)
              print('MANIFEST',code,typ,len(pages),'first',pages[:2],'last',pages[-2:],flush=True)
              for index in [0,min(len(pages)-1,8),min(len(pages)-1,100)]:
                p=pages[index]
                for kind in ('preview','original'):
                  u=root+p[kind]
                  try:
                    code,typ,n,b=get(u)
                    print('IMAGE',book,index+1,kind,code,typ,n,'bytes_sample',len(b),b[:15],flush=True)
                  except Exception as ex:print('IMAGE FAILED',book,index+1,kind,str(ex)[:160],flush=True)
            except Exception as ex: print('VOLUME FAILED',book,str(ex)[:300],flush=True)
          PY