name: Inspect archival source
on:
  push:
    paths:
      - '.github/workflows/source-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect source APIs
        run: |
          python3 - <<'PY'
          import json,urllib.request,traceback
          urls=[
            'https://www.e-rara.ch/i3f/v20/24283792/manifest',
            'https://www.e-rara.ch/zuz/download/ftpack/plain/24283792',
            'https://digi.ub.uni-heidelberg.de/diglit/iiif/huebner1768/manifest.json',
          ]
          for url in urls:
            print('\nSOURCE',url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'HuebnerDigitalEdition/0.1 research contact via github.com/DalmoMendonca/biblicalstories'})
              with urllib.request.urlopen(req,timeout=24) as f:
                body=f.read(5000000)
                print('status',f.status,'bytes',len(body),'type',f.headers.get('content-type'))
              if 'manifest' in url:
                data=json.loads(body)
                print('keys',list(data))
                seq=data.get('sequences',[{}])[0]
                canvases=seq.get('canvases',data.get('items',[]))
                print('CANVASES',len(canvases))
                for idx in [*range(min(12,len(canvases))), *range(max(12,len(canvases)//2-4),min(len(canvases),len(canvases)//2+4)), *range(max(12,len(canvases)-8),len(canvases))]:
                  c=canvases[idx]
                  print('C',idx,'label',c.get('label'),'id',c.get('@id',c.get('id')),'image',str(c.get('images',c.get('items',[])))[:450])
                print('structures',str(data.get('structures',[]))[:1500])
              else: print('sample',body[:400].decode('utf8','replace'))
            except Exception as e: print('ERROR',type(e).__name__,str(e)[:600])
          print("\\nHEIDELBERG ANALYSIS")
          url='https://digi.ub.uni-heidelberg.de/diglit/iiif/huebner1768/manifest.json'
          req=urllib.request.Request(url,headers={'User-Agent':'HuebnerDigitalEdition/0.1'})
          doc=json.load(urllib.request.urlopen(req,timeout=40))
          cc=doc.get('sequences',[{}])[0].get('canvases',[])
          print('COUNT',len(cc))
          for i,c in enumerate(cc[:95]):
            a=c.get('images',[{}])[0].get('resource',{})
            print('HB',i,str(c.get('label'))[:120],str(a.get('@id'))[:190])
          print('RANGES',len(doc.get('structures',[])))
          for s in doc.get('structures',[])[:30]:print('RANGE',str(s.get('label'))[:100],'canvases',len(s.get('canvases',[])), 'ranges',len(s.get('ranges',[])))
          import re, collections
          plates=[(i,str(c.get('label')),str(c.get('images',[{}])[0].get('resource',{}).get('@id',''))) for i,c in enumerate(cc) if re.search(r'(Tafel|Kupfer)',str(c.get('label')),re.I)]
          print('PLATES',len(plates))
          print('SAMPLE PLATES',plates[:9],plates[48:58],plates[-10:])
          print('PLATE LABELS DUPLICATE',collections.Counter(label for _,label,_ in plates).most_common(10))
          if plates:
            req=urllib.request.Request(plates[0][2],headers={'User-Agent':'HuebnerDigitalEdition/0.1'})
            with urllib.request.urlopen(req,timeout=25) as f:
              b=f.read(100)
              print('IMAGE FETCH',f.status, f.headers.get('content-type'),f.headers.get('content-length'),b[:20])

          for i in range(545,min(565,len(cc))):
            c=cc[i]
            a=c.get('images',[{}])[0].get('resource',{})
            print('END-LEAF',i,repr(c.get('label')),a.get('@id',''))
          PY