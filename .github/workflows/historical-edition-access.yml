name: Test direct access to historical edition sources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/historical-edition-access.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect digital-book reader metadata and source delivery APIs
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,html
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=12) as r: return r.read(120000)
          url='https://kp.rusneb.ru/item/reader/sto-chetyre-svyashchennyya-istorii-pyatdesyat-dve-svyashchennyya-istorii-iz-vethago-zaveta--ch1'
          s=get(url).decode('utf8','replace')
          print('RUSNEB SOURCE HTML',len(s),flush=True)
          print('END',s[-3800:],flush=True)
          for rexp in (r'<script[^>]*id="__NUXT_DATA__"[^>]*>(.*?)</script>',r'<script[^>]*>window\\.__NUXT__=(.*?)</script>',r'__NUXT__([^;]{0,700})'):
            m=re.search(rexp,s,re.S)
            print('NUXT EXTRACT',rexp,bool(m),m.group(1)[:5000] if m else '',flush=True)
          assets=list(dict.fromkeys(re.findall(r'(?<=src=")(/_nuxt/[^"]+)|(?<=href=")(/_nuxt/[^"]+)',s)))
          print('NUXT ASSETS',assets[:15],flush=True)
          js=''
          for asset in ['/_nuxt/useApi.2d5821ad.js','/_nuxt/useSectionsApi.bba38220.js','/_nuxt/index.b001c6d5.js']:
            try:
              part=get('https://kp.rusneb.ru'+asset).decode('utf8','replace')
              print('SCRIPT',asset,len(part),part[:500],flush=True)
              js+='\\n'+part
            except Exception as ex:print('SCRIPT FAILED',asset,str(ex)[:120],flush=True)
          print('JS SIZE',len(js),flush=True)
          for pat in [r'https?\S{6,140}',r'/api/\S{1,100}',r'(?:getBook|getFile|getPage|getDocument|getPdf|iiif|manifest|imageUrl|bookId|pageCount|images|bookInfo)\S{0,160}',r'\./\S+\.js']:
            print('JS MATCH',pat,list(dict.fromkeys(re.findall(pat,js,re.I)))[:40],flush=True)
          url='https://books.google.com/books?id=5elUAAAAcAAJ&pg=PA1'
          g=get(url).decode('utf8','replace')
          print('GOOGLE SIZE',len(g),flush=True)
          for needle in ['pageImage','pageImageUrl','pageInfo','PAGE_IMAGE','img=1','_OC_Hooks','imageUrl','isRestricted','pageInfoMap','SearchWithinVolume']:
            pos=g.find(needle);print('GOOGLE HIT',needle,pos,g[max(0,pos-200):pos+360] if pos>=0 else '',flush=True)
          for pat in [r'https?\S{6,180}books/content\S{0,150}',r'https?\S{6,150}(?:pageimg|pageimage)\S{0,150}']:
            print('GOOGLE URLS',list(dict.fromkeys(re.findall(pat,g,re.I)))[:10],flush=True)
          PY
