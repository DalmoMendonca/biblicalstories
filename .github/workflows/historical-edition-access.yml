name: Test direct access to historical edition sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-edition-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check original-text acquisition routes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, urllib.error
          urls = {
            'archive-search-hubner': 'https://archive.org/advancedsearch.php?q='+urllib.parse.quote('title:(Hubner Historys Bible)')+'&fl[]=identifier&rows=20&page=1&output=json',
            'archive-search-gubner': 'https://archive.org/advancedsearch.php?q='+urllib.parse.quote('title:(Biblische Historien) AND creator:(Hübner)')+'&fl[]=identifier&rows=20&page=1&output=json',
            'internet-archive-google': 'https://archive.org/metadata/bub_gb_5elUAAAAcAAJ',
            'google-book-reader': 'https://books.google.com/books?id=5elUAAAAcAAJ&pg=PA1&jscmd=SearchWithinVolume2&q=God',
            'google-play-ebook': 'https://books.google.com/books?id=5elUAAAAcAAJ&printsec=frontcover',
            'wellcome-metadata': 'https://api.wellcomecollection.org/catalogue/v2/works/bj39jxdz',
            'tuebingen-edition': 'https://opendigi.ub.uni-tuebingen.de/opendigi/Gi1824ab',
            'tuebingen-tei': 'https://opendigi.ub.uni-tuebingen.de/opendigi/tei/Gi1824ab',
            'tuebingen-tei-xml': 'https://opendigi.ub.uni-tuebingen.de/opendigi/download/tei/Gi1824ab',
            'tuebingen-ocr-xml': 'https://opendigi.ub.uni-tuebingen.de/opendigi/Gi1824ab?view=ocr',
            'russian-first-edition': 'https://kp.rusneb.ru/item/material/5fcf8bb3991f3b91423439b5',
            'russian-1825-reader': 'https://kp.rusneb.ru/item/reader/sto-chetyre-svyashchennyya-istorii-pyatdesyat-dve-svyashchennyya-istorii-iz-vethago-zaveta--ch1',
            'russian-1812-rsl': 'https://search.rsl.ru/ru/record/01008044637',
            'russian-rsl-reader': 'https://viewer.rusneb.ru/ru/000199_000009_011511257?page=1',
            'russian-modern-edition-trial': 'https://fictionbook.ru/trial/txt/24157110.txt'
          }
          for name,url in urls.items():
            print('TEST',name,url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/119.0 Safari/537.36','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=15) as r:
                body=r.read(120000)
                status=r.status;media=r.headers.get('content-type','');loc=r.url
              print('RESULT',status,media,'size_sample',len(body),'redirect',loc[:160],flush=True)
              sample=body.decode('utf-8','replace')
              if name in ('archive-search-hubner','archive-search-gubner','wellcome-metadata'):
                print('CONTENT',sample[:1600].replace('\\n',' '),flush=True)
              elif name.startswith('tuebingen'):
                print('SAMPLE',sample[:900].replace('\\n',' '),flush=True)
                print('LINKS',list(dict.fromkeys(re.findall(r'(?:href|src)=[\\\"\\\']([^\\\"\\\']{0,180}(?:xml|tei|download|ocr)[^\\\"\\\']*)',sample,re.I)))[:25],flush=True)
              elif name.startswith('russian'):
                print('SAMPLE',sample[:1100].replace('\\n',' '),flush=True)
                print('ASSETS',list(dict.fromkeys(re.findall(r'<script[^>]+src=[\\\"\\\']([^\\\"\\\']+)',sample)))[:12],flush=True)
                print('JSON',[(q, sample.find(q)) for q in ('__NEXT_DATA__','__NUXT__','iiif','manifest','api/','bookId','documentId','reader')],flush=True)
              else: print('SAMPLE',sample[:500].replace('\\n',' '),flush=True)
            except Exception as ex: print('ERROR',str(ex)[:300],flush=True)
          PY
