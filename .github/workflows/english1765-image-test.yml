name: Inspect original English 1765 facsimile image accessibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/english1765-image-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect Google Books image tokens and page images
        shell: bash
        run: |
          python3 - <<'PY'
          import re, html, json, urllib.request, urllib.error, time
          BASE='https://books.google.com/books'
          def get(url,size=250000):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/119.0 Safari/537.36','Accept':'*/*'})
            with urllib.request.urlopen(req,timeout=14) as response:
              return response.read(size),response.headers.get('Content-Type',''),response.url
          for pg in ['PA1','PA2','PA3','PA20','PA50','PA100','PA200']:
            try:
              raw,typ,loc=get(BASE+'?id=5elUAAAAcAAJ&pg='+pg)
              page=html.unescape(raw.decode('utf8','replace'))
              page=page.replace('\\u0026','&').replace('\\u003d','=').replace('\\/','/')
              ids=re.findall(r'pg=PA(\\d+)',page)
              matches=re.findall(r'https://books\\.google\\.com/books/content\\?[^"\\s<>]+',page)
              print('HTML',pg,typ,len(page),'pageids',len(ids),len(set(ids)),'match',len(matches),flush=True)
              print('IDS',sorted(set(ids))[:20],flush=True)
              print('URLS',matches[:4],flush=True)
              own=[u for u in matches if 'pg='+pg in u]
              if own:
                u=own[0].split('\\u0026')[0].replace('&amp;','&')
                try:
                  data,dt,durl=get(u,size=70000)
                  print('IMAGE',pg,len(data),dt,data[:30],durl[:230],flush=True)
                except Exception as ex:print('IMAGE FAILED',pg,type(ex).__name__,str(ex)[:180],flush=True)
              else:print('IMAGE NO SIGNED PAGE',pg,flush=True)
            except Exception as ex: print('HTML FAILED',pg,type(ex).__name__,str(ex)[:180],flush=True)
          PY