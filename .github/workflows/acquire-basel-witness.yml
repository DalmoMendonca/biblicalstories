name: Acquire additional public-domain Basel witness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/acquire-basel-witness.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve advertised ALTO download without re-OCR
        run: |
          python3 - <<'PY'
          import sys,json
          sys.path.insert(0,"scripts")
          from acquire_library_text import acquire
          result=acquire(("basel1768-alto","https://www.e-rara.ch/bau_1/download/ftpack/alto/29074139"))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Commit actual acquisition receipt and any downloaded witness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/library-text/basel1768-alto.*
          if ! git diff --cached --quiet; then
            git commit -m "Archive Basel 1768 public text acquisition result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
